<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dailys - Habit Tracker</title>
    <link rel="stylesheet" href="habits.css">
    <script src="habits.js" defer></script>
</head>
<body>

    <header>
        <img src="habits-logo.png" alt="Dailys Logo" class="logo">
    </header>

    <main>
        <input type="text" id="searchInput" placeholder="Search...">
        <h2 id="pointsDisplay">Points: 0</h2>
        
        <div id="habitsContainer"></div>

        <button id="addGoalBtn">Add Goal</button>
    </main>
</body>
</html>
